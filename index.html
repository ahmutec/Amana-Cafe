<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f3e9da">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>አማና ካፌ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;800&family=Noto+Serif+Ethiopic:wght@600;800&display=swap" rel="stylesheet">
<style id="pg"></style>
<style>
:root{
  color-scheme:light;
  --bg:#faf5ec; --card:#ffffff; --ink:#33241b; --muted:#7a6555;
  --line:#e3d3bd; --accent:#6b4226; --accent-ink:#ffffff; --err:#c0392b; --ok:#6b4226; --soft:#f3e9da;
  --t1:#6b4226; --t2:#c08a3e;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:"Noto Sans Ethiopic",system-ui,sans-serif;background:linear-gradient(160deg,#f3e9da 0%,#fbf7ef 45%,#f1e2c8 100%) fixed,var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;
  padding:max(58px,calc(env(safe-area-inset-top) + 48px)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
  font-size:16px;-webkit-text-size-adjust:100%}
@media (min-width:900px){body{padding-top:64px;font-size:17px}}
.wrap{width:100%;max-width:1100px;margin:0 auto;min-width:0}
.top,.ftr,.calcard,.cbox,.stat{width:100%;max-width:100%;box-sizing:border-box}
.cbox .tw{max-width:100%}
html,body{overflow-x:hidden}
@media (max-width:700px){.cbox table{font-size:.78rem}.cbox th,.cbox td{padding:7px 4px;white-space:normal;word-break:break-word}.cbox .tw{overflow-x:visible}.cbox th.rk,.cbox td.rk{width:24px}}

/* ቋንቋ መቀየሪያ (ግራ ጥግ) */
.lang.fix{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));z-index:50}
.lang{display:flex;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;overflow:hidden;font:inherit;cursor:pointer;padding:0;min-height:40px}
.lang span{padding:8px 12px;font-weight:600;font-size:.9rem;color:var(--muted)}
.lang span.on{background:var(--accent);color:var(--accent-ink);font-weight:800}

/* መግቢያ */
.screen{min-height:calc(100dvh - 90px);display:flex;align-items:center;justify-content:center}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(107,66,38,.10);padding:26px 22px;display:grid;gap:16px}
.card form{display:grid;gap:14px}
.card h1{margin:0;text-align:center}
.card p{margin:0;color:var(--muted);text-align:center;font-size:.95rem}
.pw{position:relative}
.pw input{padding-right:84px}
.pw button{position:absolute;right:4px;top:4px;bottom:4px;min-width:72px;border:0;border-radius:8px;background:var(--soft);color:var(--ink);font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
.links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lk{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:6px 2px;min-height:40px;text-decoration:underline}

/* ራስጌ (ዳሽቦርድ) */
.top{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"logo wel act";align-items:center;gap:14px;margin:0 0 14px;padding:10px 16px;
  background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(250,241,226,.92));border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 26px rgba(107,66,38,.12)}
.logo{background:var(--logo) center/contain no-repeat;flex:0 0 auto;filter:drop-shadow(0 3px 6px rgba(74,44,29,.35))}
.top .logo{grid-area:logo;width:74px;height:84px}
.welcome{grid-area:wel;text-align:center;min-width:0}
.welcome .wl{font-family:"Noto Serif Ethiopic","Noto Sans Ethiopic",serif;font-weight:800;font-size:clamp(1.15rem,2.6vw,2rem);line-height:1.35;letter-spacing:.3px;margin:0;
  background:linear-gradient(90deg,#4a2c1d,#8a5a36 45%,#c08a3e);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;display:inline-block}
.welcome .orn{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--t2);font-size:.95rem;margin-top:2px}
.welcome .orn::before,.welcome .orn::after{content:"";height:2px;width:clamp(30px,9vw,110px);border-radius:2px;background:linear-gradient(90deg,transparent,var(--t2))}
.welcome .orn::after{transform:scaleX(-1)}
.act{grid-area:act;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.act .row{display:flex;gap:8px;align-items:center}
.act #who{margin:0;color:var(--muted);font-size:.8rem;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.out{font:inherit;font-weight:600;min-height:44px;padding:0 16px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;cursor:pointer;white-space:nowrap}
.out:hover{border-color:var(--accent)}
.out.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:800}
@media (max-width:700px){
  .top{grid-template-columns:auto 1fr;grid-template-areas:"logo act" "wel wel";padding:10px 12px}
  .top .logo{width:56px;height:64px}
  .act{align-items:flex-end}
}
.lgwrap{display:grid;justify-items:center;gap:14px;width:100%}
.lgwrap .logo{width:150px;height:168px}
body.inapp{padding-top:max(14px,calc(env(safe-area-inset-top) + 8px))}
.card h1{font-size:2rem;font-weight:800;margin:0;line-height:1.25;letter-spacing:.5px;
  background:linear-gradient(90deg,var(--t1),var(--t2));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;display:inline-block}
.card h1::after{content:"";display:block;width:56px;height:3px;margin:6px auto 0;border-radius:3px;background:linear-gradient(90deg,var(--t1),var(--t2))}
@media (min-width:900px){.card h1{font-size:2.4rem}}

/* ዳሽቦርድ */
.dash{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);width:100%}
.dash>*,.cals>*,.charts>*,.stats>*{min-width:0}
.cals{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.cals{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.calcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;box-shadow:0 4px 16px rgba(107,66,38,.07)}
.calcard .ct{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.calcard .ct b{font-size:1rem}
.calcard .big{font-size:1.25rem;font-weight:800;color:var(--accent);margin:0 0 8px}
.calcard .big small{display:block;font-size:.8rem;font-weight:600;color:var(--muted)}
.calcard .nv{display:flex;gap:4px}
.calcard .nv button{width:36px;height:36px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:9px;font-size:1.2rem;cursor:pointer}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.mg .wd{font-size:.72rem;color:var(--muted);padding:3px 0}
.mg .dd{height:34px;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:.9rem;font-variant-numeric:tabular-nums}
.mg .dd.now{background:var(--accent);color:var(--accent-ink);font-weight:800}
.mg .dd.fri{color:var(--t2);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:760px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{border-radius:16px;padding:14px 16px;color:#fff;box-shadow:0 6px 16px rgba(107,66,38,.18);display:grid;gap:2px}
.stat small{opacity:.9;font-size:.85rem}
.stat b{font-size:1.9rem;font-weight:800;line-height:1.1}
.stat.s1{background:linear-gradient(135deg,#6b4226,#8a5a36)}
.stat.s2{background:linear-gradient(135deg,#4a2c1d,#6b4226)}
.stat.s3{background:linear-gradient(135deg,#c08a3e,#d9a95a)}
.stat.s4{background:linear-gradient(135deg,#3d5a2a,#5c7d40)}
.charts{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.charts{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}
.cbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 4px 16px rgba(107,66,38,.07)}
.cbox h3{margin:0 0 12px;font-size:1.02rem}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.cm{background:#6b4226}.cf{background:#c9953c}.cu{background:#b8aa98}
.bars{display:grid;gap:12px}
.br .bn{display:flex;justify-content:space-between;font-weight:600;font-size:.92rem;margin-bottom:4px}
.br .bn span:last-child{color:var(--muted);font-weight:600}
.br .tr{display:grid;gap:3px}
.br .bar{height:16px;border-radius:6px;min-width:0;display:flex;align-items:center;justify-content:flex-end;color:#fff;font-size:.72rem;font-weight:800;padding:0 6px;transition:width .5s}
.donutw{display:grid;justify-items:center;gap:14px}
.donut{width:190px;height:190px;border-radius:50%;display:grid;place-items:center}
.donut div{width:116px;height:116px;border-radius:50%;background:var(--card);display:grid;place-content:center;text-align:center}
.donut b{font-size:1.8rem;line-height:1}
.donut small{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{display:flex;align-items:center;gap:12px;font:inherit;font-weight:700;text-align:left;min-height:62px;padding:10px 16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;cursor:pointer;box-shadow:0 3px 10px rgba(107,66,38,.06)}
.tile:hover{border-color:var(--accent)}
.tile .ic{font-size:1.5rem}

/* footer */
.ftr{margin:26px auto 6px;max-width:1100px;text-align:center;color:#f3e3c6;font-size:.88rem;padding:18px 14px;border-radius:16px;background:linear-gradient(135deg,#4a2c1d,#6b4226);border-top:3px solid #c08a3e;box-shadow:0 8px 24px rgba(74,44,29,.25)}

/* ምናሌ ማናጀር */
.mrow{display:grid;gap:12px;margin-bottom:14px}
@media (min-width:640px){.mrow{grid-template-columns:1fr auto;align-items:end}}
.maddrow{display:grid;gap:10px;margin:0 0 14px;padding:14px;border:1.5px dashed var(--line);border-radius:12px;background:var(--soft)}
@media (min-width:640px){.maddrow{grid-template-columns:2fr 1fr auto;align-items:end}}
.maddrow .submit{min-height:48px;padding:0 20px;font-size:1rem}

.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.tabs button{flex:1 1 auto;min-width:84px;font:inherit;font-weight:600;font-size:.92rem;min-height:46px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;cursor:pointer;padding:4px 8px}
.tabs button[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:800}
.tabs.sub button{min-height:40px;font-size:.86rem;font-weight:600;background:transparent}
.tabs.sub button[aria-selected=true]{background:var(--soft);color:var(--ink);border-color:var(--accent)}

/* ገጽ አቀማመጥ: ይዘት + ቀኝ ጎን ምናሌ */
.layout{display:grid;gap:14px;align-items:start}
.main{min-width:0}
.pgtitle{margin:0 0 12px;font-size:1.5rem;font-weight:800;background:linear-gradient(90deg,var(--t1),var(--t2));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;display:inline-block}
.side{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.side button{flex:0 0 auto;display:flex;align-items:center;gap:10px;font:inherit;font-weight:600;min-height:50px;padding:0 16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;cursor:pointer;white-space:nowrap;text-align:left}
.side button .ic{font-size:1.25rem}
.side button[aria-current=page]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:800}
/* ኮምፒውተር: ዋና ምናሌ በአንድ ረድፍ ከላይ፤ ስፋቱ ከታችኛው ይዘት አይበልጥም */
@media (min-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .main{order:2}
  .side{order:1;flex-direction:row;overflow-x:auto;width:100%;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;gap:8px;box-shadow:0 4px 16px rgba(107,66,38,.07)}
  .side button{flex:1 1 0;min-width:0;justify-content:center;border-color:transparent;background:transparent}
  .side button[aria-current=page]{border-color:var(--accent)}
}
@media (max-width:899px){.side{order:-1}}
form.fm,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 4px 16px rgba(107,66,38,.07)}
@media (min-width:600px){form.fm,.panel{padding:22px}}
form.fm{display:grid;gap:16px}
label{display:block;font-weight:600;margin-bottom:6px;font-size:.95rem}
select,input,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:12px;min-height:48px}
select option{color:#000}
input[readonly]{opacity:.75}
textarea{min-height:84px;resize:vertical}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.row2{display:grid;gap:16px}
@media (min-width:600px){.row2{grid-template-columns:1fr 1fr}}
.cat{border-top:2px solid var(--accent);padding-top:16px}
.submit{background:linear-gradient(135deg,#6b4226,#8a5a36);color:var(--accent-ink);border:0;border-radius:12px;font:inherit;font-weight:800;font-size:1.1rem;padding:14px;cursor:pointer;min-height:54px}
.submit[disabled]{opacity:.6;cursor:wait}
.msg{min-height:1.4em;font-weight:600;text-align:center}
.msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
.cal{position:relative}
.dbtn{width:100%;text-align:left;font:inherit;font-weight:600;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:12px;min-height:48px;cursor:pointer}
.pop{position:absolute;left:0;top:calc(100% + 6px);z-index:20;width:min(320px,calc(100vw - 28px));background:var(--card);border:1.5px solid var(--accent);border-radius:12px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ph button{width:44px;height:44px;border:0;background:transparent;color:var(--ink);font-size:1.6rem;cursor:pointer;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.grid .wd{font-size:.72rem;color:var(--muted);padding:4px 0}
.grid button{height:40px;border:0;border-radius:10px;background:transparent;color:var(--ink);font:inherit;cursor:pointer}
.grid button.sel{background:var(--accent);color:var(--accent-ink);font-weight:800}
.grid button.now{outline:1.5px solid var(--accent)}
.todaybtn{width:100%;margin-top:6px;min-height:40px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
.items{display:grid;gap:8px}
@media (min-width:600px){.items{grid-template-columns:1fr 1fr}}
.it{display:grid;grid-template-columns:auto 1fr 84px;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;min-height:52px;margin:0}
.it.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.it input[type=checkbox]{width:24px;height:24px;min-height:0;accent-color:var(--accent);padding:0}
.it span{font-weight:600}
.it small{display:block;color:var(--muted);font-weight:400}
.it .q{min-height:40px;padding:4px 6px;text-align:center;font-weight:800}
.it .q:disabled{opacity:.35}
.hint{color:var(--muted);font-size:.9rem;padding:6px 0}
.hint.err{color:var(--err)}
.ts{font-size:.8rem;color:var(--muted);text-align:center}

/* ሪፖርት */
.panel{margin:0}
.rh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.rh strong{font-size:1.05rem;line-height:1.35}
.rh button,.mini{font:inherit;font-weight:600;min-height:44px;padding:0 14px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;cursor:pointer;white-space:nowrap}
.rc{display:grid;gap:10px;margin-bottom:14px}
.ynav{display:flex;align-items:center;justify-content:center;gap:8px}
.ynav strong{min-width:150px;text-align:center}
.ynav button{width:46px;height:46px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;font-size:1.4rem;cursor:pointer}
.weeks{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.weeks button{font:inherit;font-weight:600;min-height:48px;padding:4px 12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;cursor:pointer}
.weeks button small{display:block;font-weight:400;font-size:.72rem;color:inherit;opacity:.8}
.weeks button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;font:inherit;font-weight:600;min-height:44px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sum div{background:var(--soft);border-radius:10px;padding:10px 12px}
.sum small{display:block;color:var(--muted);font-size:.8rem}
.sum b{font-size:1.35rem;font-weight:800}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch;margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th.n,td.n{text-align:right}
th.c,td.c{text-align:center}
thead th{background:var(--accent);color:var(--accent-ink)}
tfoot td{font-weight:800;background:var(--soft);border-bottom:0}
td.n{font-variant-numeric:tabular-nums}
td small{display:block;color:var(--muted);font-weight:400;font-size:.75rem}
td.neg{color:var(--err);font-weight:700}
.rk{width:34px;color:var(--muted);text-align:center!important}
.mt th,.mt td{padding:8px 7px;text-align:right}
.mt th{min-width:74px}
.mt th:first-child,.mt td:first-child{position:sticky;left:0;background:var(--card);z-index:1;border-right:1px solid var(--line);min-width:48px;text-align:center}
.mt thead th:first-child,.mt thead th:last-child{background:var(--accent);z-index:2}
.mt th:last-child,.mt td:last-child{position:sticky;right:0;background:var(--card);z-index:1;border-left:1px solid var(--line);font-weight:800}
.mt tfoot td:first-child,.mt tfoot td:last-child{background:var(--soft)}
.mt td.z{color:var(--muted);opacity:.5}
.mt td.l,.mt th.l{text-align:left;min-width:140px}
.gen{font-size:.78rem;color:var(--muted);text-align:center;margin:10px 0}
h3.sh{margin:6px 0 8px;font-size:1rem}
.pronly{display:none}
#pr{width:100%;margin-top:6px}

/* ማስተካከያ */
.recbar{display:grid;gap:10px;margin-bottom:12px}
@media (min-width:600px){.recbar{grid-template-columns:1fr 1fr auto}}
.acts{display:flex;gap:6px}
.acts button{font:inherit;font-weight:600;min-height:38px;padding:0 10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;cursor:pointer}
.acts button.del{color:var(--err);border-color:var(--err)}
dialog{border:1.5px solid var(--accent);border-radius:14px;background:var(--card);color:var(--ink);padding:18px;width:min(520px,calc(100vw - 24px));overflow:auto;max-height:92dvh}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog form{display:grid;gap:14px}
dialog .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
dialog .btns .mini{min-height:50px}

@media print{
  :root{--bg:#fff;--card:#fff;--ink:#000;--line:#999;--muted:#444;--soft:#eee;--accent:#4a2c1d;--accent-ink:#fff;--err:#b00}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{padding:0;font-size:12px}
  .layout{display:block}
  .noprint,.lang,.lgwrap .logo,.ftr{display:none!important}
  .panel{border:0;max-width:none;padding:0}
  .tw{overflow:visible;border:0}
  .pronly{display:block;text-align:center;font-size:1.4rem;font-weight:800;margin-bottom:6px}
  table{font-size:11px}
  .mt th:first-child,.mt td:first-child,.mt th:last-child,.mt td:last-child{position:static}
  th,td{padding:4px 5px}
}

<body>
<div class="wrap">

  <!-- ራስጌ (ለሁሉም ገጾች) -->
  <header class="top noprint" id="hdr" hidden>
    <div class="logo" role="img" aria-label="Amana Cafe"></div>
    <div class="welcome">
      <h1 class="wl" data-i="welcome"></h1>
      <div class="orn" aria-hidden="true">☕</div>
    </div>
    <div class="act">
      <div class="row">
        <button type="button" class="out pri" id="gologin" data-i="login_tab" hidden></button>
        <button type="button" class="lang" aria-label="Language"><span data-l="en">En</span><span data-l="am">አማ</span></button>
        <button type="button" class="out" id="logout" data-i="logout" hidden></button>
      </div>
      <p id="who" hidden></p>
    </div>
  </header>

  <!-- ለሁሉም የሚታይ መነሻ ገጽ -->
  <section class="dash noprint" id="pub" hidden>
    <div class="cals">
      <div class="calcard" id="cal_eth_p"></div>
      <div class="calcard" id="cal_hij_p"></div>
    </div>
    <div id="dstats_p"></div>
  </section>

  <!-- መግቢያ ገጽ -->
  <div id="login" class="screen" hidden>
    <button type="button" class="lang fix noprint" aria-label="Language"><span data-l="en">En</span><span data-l="am">አማ</span></button>
    <div class="lgwrap">
    <div class="logo" role="img" aria-label="Amana Cafe"></div>
    <div class="card">
      <h1 data-i="app"></h1>

      <!-- Login -->
      <form id="lf" novalidate>
        <p data-i="login_sub"></p>
        <div>
          <label for="lcode" data-i="code"></label>
          <input id="lcode" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
        </div>
        <div>
          <label for="lpass" data-i="password"></label>
          <div class="pw">
            <input id="lpass" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false">
            <button type="button" id="lshow"></button>
          </div>
        </div>
        <div class="msg" id="lmsg" role="status" aria-live="polite"></div>
        <button class="submit" id="lbtn" type="submit" data-i="login"></button>
        <div class="links">
          <button type="button" class="lk" id="go_signup" data-i="create_pw"></button>
          <button type="button" class="lk" id="go_forgot" data-i="forgot"></button>
        </div>
      </form>

      <!-- Create password -->
      <form id="sf" novalidate hidden>
        <p data-i="signup_sub"></p>
        <div>
          <label for="srole" data-i="role"></label>
          <select id="srole"></select>
        </div>
        <div>
          <label for="scode" data-i="code"></label>
          <select id="scode"></select>
        </div>
        <div>
          <label for="semail" data-i="email"></label>
          <input id="semail" type="email" autocomplete="email" autocapitalize="none" spellcheck="false">
        </div>
        <div>
          <label for="spass" data-i="new_pass"></label>
          <input id="spass" type="password" autocomplete="new-password">
        </div>
        <div>
          <label for="spass2" data-i="confirm_pass"></label>
          <input id="spass2" type="password" autocomplete="new-password">
        </div>
        <div class="msg" id="smsg" role="status" aria-live="polite"></div>
        <button class="submit" id="sbtn" type="submit" data-i="create_btn"></button>
        <button type="button" class="lk" data-back data-i="back"></button>
      </form>

      <!-- Forgot password -->
      <form id="ff" novalidate hidden>
        <p data-i="forgot_sub"></p>
        <div>
          <label for="fcode" data-i="code"></label>
          <input id="fcode" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
        </div>
        <div>
          <label for="femail" data-i="email"></label>
          <input id="femail" type="email" autocomplete="email" autocapitalize="none" spellcheck="false">
        </div>
        <button class="submit" id="fsend" type="button" data-i="send_code"></button>
        <div id="fstep2" hidden style="display:grid;gap:14px">
          <div>
            <label for="frc" data-i="reset_code"></label>
            <input id="frc" inputmode="numeric" autocomplete="one-time-code">
          </div>
          <div>
            <label for="fpass" data-i="new_pass"></label>
            <input id="fpass" type="password" autocomplete="new-password">
          </div>
          <div>
            <label for="fpass2" data-i="confirm_pass"></label>
            <input id="fpass2" type="password" autocomplete="new-password">
          </div>
          <button class="submit" id="freset" type="submit" data-i="reset_btn"></button>
        </div>
        <div class="msg" id="fmsg" role="status" aria-live="polite"></div>
        <button type="button" class="lk" data-back data-i="back"></button>
      </form>
    </div>
    <button type="button" class="lk" id="go_home" data-i="back_home"></button>
    </div>
  </div>

  <!-- ዋናው መተግበሪያ -->
  <div id="app" hidden>

    <div class="layout" id="layout">
    <main class="main">
    <h2 class="pgtitle noprint" id="pgt"></h2>
    <nav class="tabs sub noprint" id="subs" role="tablist"></nav>

    <!-- ሽያጭ መመዝገቢያ -->
    <form id="f" class="fm noprint" novalidate hidden>
      <div class="row2">
        <div>
          <label for="waiter" data-i="waiter"></label>
          <select id="waiter" required></select>
        </div>
        <div>
          <label data-i="rec_date"></label>
          <div id="c_sales"></div>
        </div>
      </div>
      <div class="cat">
        <label for="category" data-i="category"></label>
        <select id="category" required></select>
      </div>
      <div>
        <label><span data-i="item"></span> <span style="color:var(--muted);font-weight:400" data-i="multi"></span></label>
        <div class="items" id="items"><div class="hint" data-i="choose_cat_first"></div></div>
      </div>
      <div>
        <label for="note" data-i="note"></label>
        <textarea id="note" data-ph="note_ph"></textarea>
      </div>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
      <button class="submit" id="send" type="submit" data-i="submit"></button>
      <div class="ts" id="ts"></div>
    </form>

    <!-- ስቶክ መመዝገቢያ -->
    <form id="fs" class="fm noprint" novalidate hidden>
      <div>
        <label for="st_name" data-i="item_name"></label>
        <input id="st_name" list="names" autocomplete="off">
        <datalist id="names"></datalist>
      </div>
      <div class="row2">
        <div>
          <label for="st_type" data-i="inout"></label>
          <select id="st_type"></select>
        </div>
        <div>
          <label for="st_qty" data-i="qty"></label>
          <input id="st_qty" type="number" inputmode="decimal" min="0" step="any">
        </div>
      </div>
      <div class="row2">
        <div>
          <label for="st_price" data-i="unit_price"></label>
          <input id="st_price" type="number" inputmode="decimal" min="0" step="any">

const ETH_EPOCH = 1723856;
function gregToEth(y, m, d) {
  const a = Math.floor((14 - m) / 12), yy = y + 4800 - a, mm = m + 12 * a - 3;
  const jdn = d + Math.floor((153 * mm + 2) / 5) + 365 * yy + Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
  const r = (jdn - ETH_EPOCH) % 1461;
  const n = (r % 365) + 365 * Math.floor(r / 1460);
  return {y: 4 * Math.floor((jdn - ETH_EPOCH) / 1461) + Math.floor(r / 365) - Math.floor(r / 1460), m: Math.floor(n / 30) + 1, d: (n % 30) + 1};
}
const daysIn = (m, y) => m < 13 ? 30 : (y % 4 === 3 ? 6 : 5);
const weeksIn = (m, y) => Math.ceil(daysIn(m, y) / 7);
const weekday = (y, m, d) => (ETH_EPOCH + 365 * y + Math.floor(y / 4) + 30 * m + d - 31 + 1) % 7;   // 0 = እሑድ
const n0 = new Date();
const TODAY = gregToEth(n0.getFullYear(), n0.getMonth() + 1, n0.getDate());
const ethText = o => o.d + " " + mName(o.m) + " " + o.y;
function parseEthTxt(s) {
  const p = String(s).trim().split(/\s+/);
  const m = E_AM.indexOf(p[1]) + 1;
  return (p.length >= 3 && m) ? {y: parseInt(p[2], 10), m: m, d: parseInt(p[0], 10)} : {...TODAY};
}

const CALS = [];
function makeCal(root, onChange, init) {
  const st = {sel: {...(init || TODAY)}};
  st.view = {y: st.sel.y, m: st.sel.m};
  root.className = "cal";
  root.innerHTML = '<button type="button" class="dbtn"></button><div class="pop" hidden role="dialog"><div class="ph"><button type="button" class="pm">‹</button><strong class="pt"></strong><button type="button" class="nm">›</button></div><div class="grid"></div><button type="button" class="todaybtn"></button></div>';
  const q = s => root.querySelector(s), pop = q(".pop");
  const label = () => { q(".dbtn").textContent = ethText(st.sel) + " " + t("ec"); q(".todaybtn").textContent = t("today"); };
  const pick = o => { st.sel = o; label(); pop.hidden = true; if (onChange) onChange({...o}); };
  function render() {
    q(".pt").textContent = mName(st.view.m) + " " + st.view.y;
    const g = q(".grid"); g.innerHTML = "";
    for (let i = 0; i < 7; i++) g.appendChild(el("div", WDN(i), "wd"));
    for (let i = 0; i < weekday(st.view.y, st.view.m, 1); i++) g.appendChild(document.createElement("div"));
    for (let d = 1; d <= daysIn(st.view.m, st.view.y); d++) {
      const b = el("button", d); b.type = "button";
      if (st.sel.y === st.view.y && st.sel.m === st.view.m && st.sel.d === d) b.classList.add("sel");
      if (TODAY.y === st.view.y && TODAY.m === st.view.m && TODAY.d === d) b.classList.add("now");
      b.onclick = () => pick({y: st.view.y, m: st.view.m, d});
      g.appendChild(b);
    }
  }
  const shiftv = k => { st.view.m += k; if (st.view.m > 13) { st.view.m = 1; st.view.y++; } if (st.view.m < 1) { st.view.m = 13; st.view.y--; } render(); };
  q(".pm").onclick = () => shiftv(-1);
  q(".nm").onclick = () => shiftv(1);
  q(".todaybtn").onclick = () => pick({...TODAY});
  q(".dbtn").onclick = () => { st.view = {y: st.sel.y, m: st.sel.m}; render(); pop.hidden = !pop.hidden; };
  const api = {root, get: () => ({...st.sel}), set(o) { st.sel = {...o}; label(); }, refresh() { label(); if (!pop.hidden) render(); }};
  CALS.push(api); label();
  return api;
}

async function api(action, payload) {
  const body = JSON.stringify(Object.assign({action, token: AUTH ? AUTH.token : ""}, payload || {}));
  const r = await fetch(SCRIPT_URL, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body});
  const j = await r.json();
  if (!j.ok && j.error === "AUTH" && AUTH) { logout(t("e_AUTH")); throw new Error("AUTH"); }
  return j;
}
async function post(act, data, btnId, msgId, after) {
  $(btnId).disabled = true; setMsg(msgId, t("sending"));
  try {
    const j = await api(act, data);
    if (!j.ok) { setMsg(msgId, errText(j.error), "err"); return j; }
    setMsg(msgId, "✓ " + t("saved"), "ok");
    if (after) after(j);
    return j;
  } catch (err) {
    if (err.message !== "AUTH") setMsg(msgId, t("e_NET"), "err");
  } finally { $(btnId).disabled = false; }
}

function nav(label, onPrev, onNext) {
  const d = el("div", null, "ynav");
  const p = el("button", "‹"); p.type = "button"; p.onclick = onPrev;
  const n = el("button", "›"); n.type = "button"; n.onclick = onNext;
  d.appendChild(p); d.appendChild(el("strong", label)); d.appendChild(n);
  return d;
}
function buildControls() {
  const rc = $("rc"); rc.innerHTML = "";
  const kind = KINDS[SEC + "/" + SUB];
  if (kind === "date") {
    const w = el("div"); w.appendChild(el("label", t("pick_date")));
    const m = document.createElement("div"); w.appendChild(m); rc.appendChild(w);
    makeCal(m, d => { RC.date = d; loadReport(); }, RC.date);
  } else if (kind === "year") {
    rc.appendChild(nav(String(RC.year) + " " + t("ec"), () => { RC.year--; loadReport(); }, () => { RC.year++; loadReport(); }));
  } else if (kind === "month" || kind === "week") {
    const mv = k => { let {y, m} = RC.month; m += k; if (m > 13) { m = 1; y++; } if (m < 1) { m = 13; y--; } RC.month = {y, m}; RC.week = (y === TODAY.y && m === TODAY.m) ? Math.min(Math.ceil(TODAY.d / 7), weeksIn(m, y)) : 1; loadReport(); };
    rc.appendChild(nav(mName(RC.month.m) + " " + RC.month.y, () => mv(-1), () => mv(1)));
    if (kind === "week") {
      const ws = el("div", null, "weeks");
      const n = weeksIn(RC.month.m, RC.month.y);
      if (RC.week > n) RC.week = 1;
      for (let w = 1; w <= n; w++) {
        const b = el("button", t("week_n", w)); b.type = "button";
        b.appendChild(el("small", (w - 1) * 7 + 1 + "–" + Math.min(w * 7, daysIn(RC.month.m, RC.month.y))));
        b.setAttribute("aria-pressed", String(w === RC.week));
        b.onclick = () => { RC.week = w; loadReport(); };
        ws.appendChild(b);
      }
      rc.appendChild(ws);
    }
  }
}

const weekText = () => {
  const n = daysIn(RC.month.m, RC.month.y), a = (RC.week - 1) * 7 + 1, b = Math.min(RC.week * 7, n);
  return t("week") + " " + RC.week + " (" + a + "–" + b + " " + mName(RC.month.m) + " " + RC.month.y + ")";
};

function tbl(head, rows, foot, cls) {

  head.forEach(h => { const o = typeof h === "object" ? h : {t: h}; const c = el("th", o.t); if (o.c) c.className = o.c; hr.appendChild(c); });
  const body = tb.createTBody();
  rows.forEach(r => {
    const tr = body.insertRow();
    r.forEach(c => {
      const o = (c !== null && typeof c === "object") ? c : {t: c};
      const td = el("td", o.t); if (o.c) td.className = o.c;
      if (o.s) td.appendChild(el("small", o.s));
      tr.appendChild(td);

  });
  if (foot) {
    const f = tb.createTFoot().insertRow();
    foot.forEach(c => { const o = (c !== null && typeof c === "object") ? c : {t: c}; const td = el("td", o.t); if (o.c) td.className = o.c; f.appendChild(td); });
  }

}

  c.appendChild(el("div", mName(v.m) + " " + v.y, "gen"));
  const g = el("div", null, "mg");
  for (let i = 0; i < 7; i++) g.appendChild(el("div", WDN(i), "wd"));
  const off = weekday(v.y, v.m, 1);
  for (let i = 0; i < off; i++) g.appendChild(document.createElement("div"));
  for (let d = 1; d <= daysIn(v.m, v.y); d++) {
    const x = el("div", d, "dd");
    if ((off + d - 1) % 7 === 5) x.classList.add("fri");
    if (v.y === TODAY.y && v.m === TODAY.m && d === TODAY.d) x.classList.add("now");
    g.appendChild(x);
  }
  c.appendChild(g);
}
function drawCalHij(id) {
  let h0, now = new Date();
  try {
    if (!DASHC.hij) DASHC.hij = hijStart(new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12));
    h0 = hijriOf(DASHC.hij);
  } catch (_) { const c = calShell(id, "🌙 " + t("cal_hij"), () => {}, () => {}); c.appendChild(el("div", t("cal_na"), "hint")); return; }
  const start = DASHC.hij;
  let len = 1; while (len < 31 && hijriOf(addDays(start, len)).m === h0.m) len++;
  const c = calShell(id, "🌙 " + t("cal_hij"),
    () => { DASHC.hij = hijStart(addDays(start, -1)); renderCalHij(); },
    () => { DASHC.hij = hijStart(addDays(start, len)); renderCalHij(); });
  const th = hijriOf(now);
  const big = el("p", WDF(now.getDay()) + " · " + th.d + " " + hName(th.m) + " " + th.y + " " + t("ah"), "big");
  big.appendChild(el("small", now.toLocaleDateString("en-GB", {day: "numeric", month: "long", year: "numeric"})));
  c.appendChild(big);
  c.appendChild(el("div", hName(h0.m) + " " + h0.y + " " + t("ah"), "gen"));
  const g = el("div", null, "mg");
  for (let i = 0; i < 7; i++) g.appendChild(el("div", WDN(i), "wd"));
  const off = start.getDay();
  for (let i = 0; i < off; i++) g.appendChild(document.createElement("div"));
  for (let d = 1; d <= len; d++) {
    const dt = addDays(start, d - 1), x = el("div", d, "dd");
    if (dt.getDay() === 5) x.classList.add("fri");
    if (dt.getFullYear() === now.getFullYear() && dt.getMonth() === now.getMonth() && dt.getDate() === now.getDate()) x.classList.add("now");
    g.appendChild(x);
  }
  c.appendChild(g);
}
const renderCalEth = () => { drawCalEth("cal_eth"); drawCalEth("cal_eth_p"); };
const renderCalHij = () => { drawCalHij("cal_hij"); drawCalHij("cal_hij_p"); };
const posLabel = g => (g.key !== "other" && L[lang]["pos_" + g.key] !== undefined) ? t("pos_" + g.key) : (g.label || "—");

const renderDashStats = () => drawStats("dstats", false);
const renderPubStats = () => drawStats("dstats_p", true);
function drawStats(boxId, pub) {
  const box = $(boxId); box.innerHTML = "";
  if (!DASHREP) return;
  if (!pub && (!AUTH || AUTH.kind === "cashier")) return;
  const R = DASHREP, T = R.totals;
  const st = el("div", null, "stats");
  [["s1", t("d_total"), T.all], ["s2", t("d_male"), T.m], ["s3", t("d_female"), T.f], ["s4", t("d_pos"), R.groups.length]].forEach(([c, k, v]) => {
    const d = el("div", null, "stat " + c); d.appendChild(el("small", k)); d.appendChild(el("b", fmt(v))); st.appendChild(d);
  });
  box.appendChild(st);
  if (!T.all) { box.appendChild(el("div", t("none"), "hint")); return; }

  const ch = el("div", null, "charts");
  // አምድ ግራፍ: በድርሻ ወንድ / ሴት
  const b1 = el("div", null, "cbox"); b1.appendChild(el("h3", t("d_by_pos")));
  const lg = el("div", null, "legend");
  [["cm", t("male")], ["cf", t("female")]].concat(T.u ? [["cu", t("unspec")]] : []).forEach(([c, k]) => { const s = el("span"); const i = el("i"); i.className = c; s.appendChild(i); s.appendChild(document.createTextNode(k)); lg.appendChild(s); });
  b1.appendChild(lg);
  const max = Math.max.apply(null, R.groups.map(g => Math.max(g.m, g.f, g.u)).concat([1]));
  const bars = el("div", null, "bars");
  R.groups.forEach(g => {
    const row = el("div", null, "br"), nm = el("div", null, "bn");
    nm.appendChild(el("span", posLabel(g))); nm.appendChild(el("span", fmt(g.total)));
    row.appendChild(nm);
    const tr = el("div", null, "tr");
    [["cm", g.m], ["cf", g.f], ["cu", g.u]].forEach(([c, v]) => {
      if (!v) return;
      const b = el("div", String(v), "bar " + c); b.style.width = Math.max(8, v / max * 100) + "%"; tr.appendChild(b);
    });
    row.appendChild(tr); bars.appendChild(row);
  });
  b1.appendChild(bars); ch.appendChild(b1);

  // ዶናት: አጠቃላይ ወንድ / ሴት
  const b2 = el("div", null, "cbox"); b2.appendChild(el("h3", t("d_gender")));
  const w = el("div", null, "donutw"), dn = el("div", null, "donut");
  const pm = T.m / T.all * 100, pf = pm + T.f / T.all * 100;
  dn.style.background = "conic-gradient(#6b4226 0 " + pm + "%, #c9953c " + pm + "% " + pf + "%, #b8aa98 " + pf + "% 100%)";
  const mid = el("div"); mid.appendChild(el("b", fmt(T.all))); mid.appendChild(el("small", t("d_total"))); dn.appendChild(mid);
  w.appendChild(dn);
  const lg2 = lg.cloneNode(true); lg2.style.marginBottom = "0"; w.appendChild(lg2);
  b2.appendChild(w); ch.appendChild(b2);
  box.appendChild(ch);

  // ዝርዝር ሰንጠረዥ
  const b3 = el("div", null, "cbox"); b3.style.marginTop = "16px"; b3.appendChild(el("h3", t("d_table")));
  const head = [{t: t("c_no"), c: "rk"}, t("emp_pos"), {t: t("male"), c: "n"}, {t: t("female"), c: "n"}].concat(T.u ? [{t: t("unspec"), c: "n"}] : [], [{t: t("col_total"), c: "n"}]);
  const rows = R.groups.map((g, i) => [RK(i), posLabel(g), N(g.m), N(g.f)].concat(T.u ? [N(g.u)] : [], [N(g.total)]));
  const foot = ["", t("sum"), N(T.m), N(T.f)].concat(T.u ? [N(T.u)] : [], [N(T.all)]);
  b3.appendChild(tbl(head, rows, foot)); box.appendChild(b3);
}
function renderTiles() {
  const box = $("dtiles"); box.innerHTML = "";
  if (!AUTH) return;
  const P = perms();
  Object.keys(P).filter(s => s !== "home").forEach(s => {
    const b = el("button"); b.type = "button"; b.className = "tile";
    b.appendChild(el("span", ICONS[s], "ic")); b.appendChild(el("span", t("sec_" + s)));
    b.onclick = () => showView(s, P[s][0]); box.appendChild(b);
  });
}
function renderDash() { renderCalEth(); renderCalHij(); renderDashStats(); renderTiles(); }
async function loadPubStats() {
  try {
    const j = await api("pub_dash");
    if (j.ok) { DASHREP = j.report; if (!$("pub").hidden) renderPubStats(); }
  } catch (_) {}
}
async function loadDash() {
  renderDash();
  if (!AUTH || AUTH.kind === "cashier") return;
  try {
    const j = await api("dash");
    if (j.ok) { DASHREP = j.report; if (SEC === "home") renderDashStats(); }
  } catch (_) {}
}

/* ===== ምናሌ ማስተካከያ (ማናጀር) ===== */
let MGR = [], MGRSEL = "";
function afterMenuChange() { MENU = []; localStorage.removeItem("amana_menu"); loadMenuMgr(true); }
async function loadMenuMgr(quiet) {
  if (!AUTH || AUTH.kind !== "manager") return;
  if (!quiet) setMsg("m_menu", t("loading"));
  const my = ++REQ;
  try {
    const j = await api("menu_full");
    if (my !== REQ) return;
    if (!j.ok) { setMsg("m_menu", errText(j.error), "err"); return; }
    MGR = j.menu; if (!quiet) setMsg("m_menu", ""); renderMenuMgr();
  } catch (err) { if (err.message !== "AUTH") setMsg("m_menu", t("e_NET"), "err"); }
}
const curCat = () => MGR[parseInt($("m_cat").value, 10)];
function renderMenuMgr() {
  const sel = $("m_cat"); sel.innerHTML = "";
  MGR.forEach((c, i) => sel.add(new Option(c.category, String(i))));
  const at = MGR.findIndex(c => c.category === MGRSEL);
  if (MGR.length) sel.value = String(at >= 0 ? at : 0);
  const cat = curCat(); if (cat) MGRSEL = cat.category;
  const box = $("mlist"); box.innerHTML = "";
  if (!cat) return;
  if (!cat.items.length) { box.appendChild(el("div", t("no_items"), "hint")); return; }
  const w = el("div", null, "tw"), tb = document.createElement("table");
  const hr = tb.createTHead().insertRow();
  [t("c_no"), t("c_item"), t("c_price"), t("actions")].forEach(x => hr.appendChild(el("th", x)));
  const body = tb.createTBody();
  cat.items.forEach((it, i) => {
    const tr = body.insertRow();
    tr.appendChild(el("td", i + 1, "rk")); tr.appendChild(el("td", it.name)); tr.appendChild(el("td", fmt(it.price), "n"));
    const td = el("td"), acts = el("div", null, "acts");
    const eb = el("button", t("edit")); eb.type = "button"; eb.onclick = () => editMenuItem(it);
    const db = el("button", t("del"), "del"); db.type = "button"; db.onclick = () => delMenuItem(it);
    acts.appendChild(eb); acts.appendChild(db); td.appendChild(acts); tr.appendChild(td);
  });
  w.appendChild(tb); box.appendChild(w);
}
function openSimpleDialog(title, fields, cb) {
  EDIT = null; DLG_CB = cb;
  const box = $("dfields"); box.innerHTML = ""; $("dtitle").textContent = title; setMsg("dmsg", "");
  const ins = [];
  fields.forEach(f => {
    const wr = el("div"); wr.appendChild(el("label", f.label));
    const i = document.createElement("input");
    if (f.type === "number") { i.type = "number"; i.step = "any"; i.min = "0"; i.inputMode = "decimal"; }
    i.value = f.value; wr.appendChild(i); box.appendChild(wr); ins.push(i);
  });
  $("dlg").showModal(); ins[0].focus();
}
function editMenuItem(it) {
  openSimpleDialog(t("m_edit_item"), [{label: t("c_item"), value: it.name}, {label: t("c_price"), value: it.price, type: "number"}],
    v => api("menu_update", {row: it.row, oldName: it.name, name: v[0], price: v[1]}));
}
async function delMenuItem(it) {
  if (!confirm(t("m_confirm_del"))) return;
  setMsg("m_menu", t("sending"));
  try {
    const j = await api("menu_delete", {row: it.row, oldName: it.name});
    if (!j.ok) { setMsg("m_menu", errText(j.error), "err"); if (j.error === "STALE") afterMenuChange(); return; }
    setMsg("m_menu", "✓", "ok"); afterMenuChange();
  } catch (err) { if (err.message !== "AUTH") setMsg("m_menu", t("e_NET"), "err"); }
}
$("m_cat").addEventListener("change", () => { const c = curCat(); if (c) MGRSEL = c.category; renderMenuMgr(); });
$("m_ref").addEventListener("click", () => loadMenuMgr());
$("m_ren").addEventListener("click", () => {
  const c = curCat(); if (!c) return;
  openSimpleDialog(t("m_rename_cat"), [{label: t("category"), value: c.category}], async v => {
    const j = await api("menu_cat_rename", {row: c.row, oldName: c.category, name: v[0]});
    if (j.ok) MGRSEL = v[0]; return j;
  });
});
$("m_newcat").addEventListener("click", () => {
  openSimpleDialog(t("m_new_cat"), [{label: t("m_cat_name"), value: ""}], async v => {
    const j = await api("menu_cat_add", {name: v[0]});
    if (j.ok) MGRSEL = v[0]; return j;
  });
});
$("m_add").addEventListener("click", async () => {
  const c = curCat(), name = $("m_name").value.trim(), price = parseFloat($("m_price").value);
  if (!c) return;
  if (!name) { setMsg("m_menu", t("e_BAD_NAME"), "err"); $("m_name").focus(); return; }
  if (!(price >= 0)) { setMsg("m_menu", t("e_BAD_AMOUNT"), "err"); $("m_price").focus(); return; }
  await post("menu_add", {category: c.category, catRow: c.row, name, price}, "m_add", "m_menu", () => {
    $("m_name").value = ""; $("m_price").value = ""; $("m_name").focus(); afterMenuChange();
  });
});

/* ===== footer ===== */
function renderFooter() {
  $("ftr").textContent = "© " + new Date().getFullYear() + " Amana Cafe · All rights reserved.";
}

/* ===== ቋንቋ ማዘመን ===== */
function applyLang() {
  document.documentElement.lang = lang; document.title = t("app");
  document.querySelectorAll("[data-i]").forEach(n => { n.textContent = t(n.dataset.i); });
  document.querySelectorAll("[data-ph]").forEach(n => { n.placeholder = t(n.dataset.ph); });
  document.querySelectorAll(".lang span").forEach(s => s.classList.toggle("on", s.dataset.l === lang));
  $("lshow").textContent = $("lpass").type === "password" ? t("show") : t("hide");
  setPh("waiter", "choose"); setPh("category", MENU.length ? "choose_cat" : "menu_loading"); setPh("pa_emp", "choose"); setPh("srole", "choose_role"); setPh("scode", "pick_code");
  if (!$("category").value && !$("items").querySelector(".it")) { $("items").innerHTML = ""; $("items").appendChild(el("div", t("choose_cat_first"), "hint")); }
  fillTypes(); renderFooter();
  const keepDs = $("rds").value; if ($("rds").options.length) fillRds(); else fillRds();
  if (keepDs) $("rds").value = keepDs;
  CALS.forEach(c => { if (c.root.isConnected) c.refresh(); });
  if (!$("pub").hidden) { renderCalEth(); renderCalHij(); renderPubStats(); }
  if (AUTH && !$("app").hidden) {
    $("who").textContent = AUTH.role + " · " + AUTH.code;
    buildNav();
    if (!FORMS[SEC + "/" + SUB]) { if (SEC === "records") renderRecs(); else if (SEC === "home") renderDash(); else if (SEC === "menu") renderMenuMgr(); else if (LASTREP) { buildControls(); $("rt").textContent = titleFor(); $("rbrand").textContent = t("app") + " — " + titleFor(); drawReport(); } }
  }
}
document.querySelectorAll(".lang").forEach(b => b.addEventListener("click", () => {
  lang = lang === "am" ? "en" : "am";
  localStorage.setItem("amana_lang", lang);
  applyLang();
}));

/* ===== ጅምር ===== */
applyLang();
if (AUTH && AUTH.token) {
  // ሚናውን ከሰርቨር እንደገና አረጋግጥ (የድሮ መረጃ እንዳይቀር)
  api("me").then(j => {
    if (!AUTH) return;
    if (j && j.ok) { AUTH.kind = j.kind; AUTH.role = j.role; localStorage.setItem("amana_auth", JSON.stringify(AUTH)); }
    else if (j && j.error === "UNKNOWN") { logout(); return; }
    enterApp();
  }).catch(() => { if (AUTH) enterApp(); });
} else showPublic();
